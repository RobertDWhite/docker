name: Security runtime candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [default, sqlite, mariadb, postgresql]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and test
        run: |
          docker compose -f tests/docker-compose.${{ matrix.database }}.yml build
          pip install pytest pytest-docker requests
          py.test --database=${{ matrix.database }} tests/
      - name: Cleanup
        if: always()
        run: docker compose -p wallabag_${{ matrix.database }} -f tests/docker-compose.${{ matrix.database }}.yml down -v
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/robertdwhite/wallabag-security:sha-${{ github.sha }}
